<title>Winder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Asosiy qatlam (tokenlar va komponentlar). Liquid Glass qatlami shu blok oxirida uni ustidan yozadi. */
:root{
  --bg:#f5f5f7; --tile:#ffffff; --tile-2:#fafafc; --fill:#e8e8ed; --fill-2:#efeff3;
  --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#86868b; --line:#d2d2d7; --hair:rgba(0,0,0,.08);
  --accent:#0071e3; --accent-ink:#0066cc; --accent-soft:rgba(0,113,227,.1); --on-accent:#ffffff;
  --nav:rgba(250,250,252,.8); --scrim:rgba(0,0,0,.28);
  --logo-bg:#1d1d1f; --logo-fg:#ffffff; --logo-arrow:#2997ff;
  --shadow:0 2px 14px rgba(0,0,0,.06); --shadow-lg:0 30px 80px rgba(0,0,0,.22);
  --blue:#0060c7; --blue-bg:rgba(0,113,227,.1);
  --indigo:#4f4bd1; --indigo-bg:rgba(88,86,214,.12);
  --orange:#b25000; --orange-bg:rgba(255,149,0,.16);
  --purple:#8944ab; --purple-bg:rgba(175,82,222,.13);
  --green:#1f7a34; --green-bg:rgba(52,199,89,.16);
  --red:#d70015; --red-bg:rgba(255,59,48,.12);
  --gray:#6e6e73; --gray-bg:rgba(142,142,147,.16);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-tile:22px; --r-card:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --tile:#1c1c1e; --tile-2:#232325; --fill:#2c2c2e; --fill-2:#18181a;
    --ink:#f5f5f7; --ink-2:#a1a1a6; --ink-3:#8e8e93; --line:#3a3a3c; --hair:rgba(255,255,255,.1);
    --accent:#0a7cff; --accent-ink:#2997ff; --accent-soft:rgba(41,151,255,.16); --on-accent:#ffffff;
    --nav:rgba(22,22,23,.8); --scrim:rgba(0,0,0,.6);
    --logo-bg:#f5f5f7; --logo-fg:#1d1d1f; --logo-arrow:#0071e3;
    --shadow:none; --shadow-lg:0 30px 80px rgba(0,0,0,.7);
    --blue:#5aa9ff; --blue-bg:rgba(10,132,255,.2);
    --indigo:#9c9aff; --indigo-bg:rgba(94,92,230,.26);
    --orange:#ffb340; --orange-bg:rgba(255,159,10,.2);
    --purple:#da8fff; --purple-bg:rgba(191,90,242,.22);
    --green:#30d158; --green-bg:rgba(48,209,88,.18);
    --red:#ff6961; --red-bg:rgba(255,69,58,.2);
    --gray:#a1a1a6; --gray-bg:rgba(142,142,147,.22);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --tile:#1c1c1e; --tile-2:#232325; --fill:#2c2c2e; --fill-2:#18181a;
  --ink:#f5f5f7; --ink-2:#a1a1a6; --ink-3:#8e8e93; --line:#3a3a3c; --hair:rgba(255,255,255,.1);
  --accent:#0a7cff; --accent-ink:#2997ff; --accent-soft:rgba(41,151,255,.16); --on-accent:#ffffff;
  --nav:rgba(22,22,23,.8); --scrim:rgba(0,0,0,.6);
  --logo-bg:#f5f5f7; --logo-fg:#1d1d1f; --logo-arrow:#0071e3;
  --shadow:none; --shadow-lg:0 30px 80px rgba(0,0,0,.7);
  --blue:#5aa9ff; --blue-bg:rgba(10,132,255,.2);
  --indigo:#9c9aff; --indigo-bg:rgba(94,92,230,.26);
  --orange:#ffb340; --orange-bg:rgba(255,159,10,.2);
  --purple:#da8fff; --purple-bg:rgba(191,90,242,.22);
  --green:#30d158; --green-bg:rgba(48,209,88,.18);
  --red:#ff6961; --red-bg:rgba(255,69,58,.2);
  --gray:#a1a1a6; --gray-bg:rgba(142,142,147,.22);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0}
body{color:var(--ink);font-family:var(--f-text);font-size:15px;line-height:1.47;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.tnum{font-variant-numeric:tabular-nums}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:14px;height:14px}
.ico.lg{width:22px;height:22px}
.lg-bg{fill:var(--logo-bg)} .lg-w{stroke:var(--logo-fg)} .lg-a{stroke:var(--logo-arrow)}

/* Global nav */
.gnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hair)}
.gnav-in{max-width:1120px;margin:0 auto;padding-inline:22px;height:52px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-family:var(--f-display);font-size:19px;letter-spacing:-.02em}
.brand:hover{text-decoration:none}
.brand .wm b{font-weight:700;color:var(--ink)} .brand .wm span{font-weight:500;color:var(--ink-2)}
.gnav-links{display:flex;gap:4px;margin-inline:auto}
.gnav-links a{color:var(--ink);opacity:.8;font-size:13px;padding:6px 11px;border-radius:980px;display:flex;align-items:center;gap:6px}
.gnav-links a:hover{opacity:1;text-decoration:none;background:var(--fill)}
.gnav-links a[aria-current="page"]{opacity:1;background:var(--fill);font-weight:600}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;display:inline-grid;place-items:center;padding-inline:5px}
.gnav-right{display:flex;align-items:center;gap:6px}
.iconbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--fill)}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);padding:6px 10px;border-radius:980px}
.live:hover{background:var(--fill);text-decoration:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.dot.pulse{box-shadow:0 0 0 0 var(--green-bg);animation:pulse 2.4s infinite}
.dot.off{background:var(--gray)} .dot.err{background:var(--red)} .dot.warn{background:var(--orange)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.45)}70%{box-shadow:0 0 0 8px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}
.ribbon{background:var(--tile);border-bottom:1px solid var(--hair);text-align:center;font-size:13px;color:var(--ink-2);padding:10px 16px}
.ribbon a{white-space:nowrap}

/* Page */
.wrap{max-width:1120px;margin:0 auto;padding-inline:22px;padding-block:36px 120px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.phead .eyebrow{font-size:14px;font-weight:600;color:var(--accent-ink);margin-bottom:6px}
h1{font-family:var(--f-display);font-size:48px;line-height:1.08;font-weight:700;letter-spacing:-.025em;margin:0;text-wrap:balance}
.sub{font-size:19px;line-height:1.42;color:var(--ink-2);margin:10px 0 0;max-width:44em;text-wrap:pretty}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
h2{font-family:var(--f-display);font-size:28px;line-height:1.14;font-weight:700;letter-spacing:-.02em;margin:0}
h3{font-family:var(--f-display);font-size:19px;line-height:1.26;font-weight:600;letter-spacing:-.015em;margin:0}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.section{margin-top:48px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}

/* Buttons */
.btn{height:36px;padding:0 18px;border-radius:980px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .15s}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--fill);color:var(--ink)}
.btn-ghost:hover{background:var(--line)}
.btn-danger{background:var(--red-bg);color:var(--red)}
.btn[disabled]{opacity:.45;cursor:default}
.btn-sm{height:30px;padding:0 13px;font-size:13px}
.link{color:var(--accent-ink);font-size:14px;display:inline-flex;align-items:center;gap:2px}
.link:hover{text-decoration:underline}
.seg{display:inline-flex;background:var(--fill);border-radius:980px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 14px;border-radius:980px;font-size:13px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--tile);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Bento */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.tile{background:var(--tile);border-radius:var(--r-tile);padding:24px;min-width:0;box-shadow:var(--shadow);display:flex;flex-direction:column}
.c-3{grid-column:span 3}.c-4{grid-column:span 4}.c-5{grid-column:span 5}.c-6{grid-column:span 6}.c-7{grid-column:span 7}.c-8{grid-column:span 8}.c-12{grid-column:span 12}
.r-2{grid-row:span 2}
.t-label{font-size:14px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.t-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.num-xl{font-family:var(--f-display);font-size:56px;line-height:1;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.num-l{font-family:var(--f-display);font-size:44px;line-height:1.02;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.num-m{font-family:var(--f-display);font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.unit{font-size:.42em;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-left:6px}
.stat-sub{font-size:14px;color:var(--ink-2);margin-top:8px}
.tile.click{cursor:pointer;transition:transform .2s ease}
.tile.click:hover{transform:scale(1.012)}
.spacer{flex:1}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:980px;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.st-new{color:var(--blue);background:var(--blue-bg)}
.st-review{color:var(--indigo);background:var(--indigo-bg)}
.st-prep{color:var(--orange);background:var(--orange-bg)}
.st-submitted{color:var(--purple);background:var(--purple-bg)}
.st-won{color:var(--green);background:var(--green-bg)}
.st-lost{color:var(--red);background:var(--red-bg)}
.st-skipped{color:var(--gray);background:var(--gray-bg)}
.c-green{color:var(--green)} .c-orange{color:var(--orange)} .c-red{color:var(--red)} .c-blue{color:var(--blue)}
.bg-green{background:var(--green-bg)} .bg-orange{background:var(--orange-bg)} .bg-red{background:var(--red-bg)}

/* Match ring */
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring .rb{fill:none;stroke:var(--fill);stroke-width:4}
.ring .rf{fill:none;stroke-width:4;stroke-linecap:round}
.ring.hi .rf{stroke:var(--green)} .ring.mid .rf{stroke:var(--accent)} .ring.lo .rf{stroke:var(--ink-3)}
.ring b{position:relative;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring.big b{font-size:22px;font-family:var(--f-display)}

/* Lists inside tiles */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--hair);min-width:0}
.row:first-child{border-top:0;padding-top:0}
.row.click{cursor:pointer}
.row.click:hover .row-title{color:var(--accent-ink)}
.row-main{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-meta{font-size:13px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{text-align:right;flex:none;font-size:13px}
.cd{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cd.urgent{color:var(--red)} .cd.soon{color:var(--orange)} .cd.over{color:var(--ink-3)}

/* Funnel */
.funnel{display:flex;flex-direction:column;gap:10px}
.fbar{width:100%;display:grid;grid-template-columns:132px 1fr 28px;align-items:center;gap:10px;font-size:13px}
.fbar .track{height:10px;border-radius:5px;background:var(--fill);overflow:hidden}
.fbar .fill{height:100%;border-radius:5px;background:currentColor}
.fbar b{text-align:right;font-variant-numeric:tabular-nums}

/* Sources grid */
.srcs{display:grid;grid-template-columns:1fr;gap:0}
.src{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hair);font-size:13px}
.src:first-child{border-top:0;padding-top:0}
.src .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.src .ct{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Tenders page */
.toolbar{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.search{position:relative}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.search input{width:100%;height:46px;border-radius:14px;border:0;background:var(--tile);box-shadow:var(--shadow);padding:0 16px 0 42px;font-size:16px;outline:none;border:1px solid var(--hair)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:12px var(--f-text);color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 14px;border-radius:980px;background:var(--fill);font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.chip:hover{background:var(--line)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip .n{opacity:.6;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.selw{position:relative;display:inline-flex;align-items:center}
.selw select{appearance:none;-webkit-appearance:none;height:34px;border-radius:980px;border:0;background:var(--fill);padding:0 32px 0 14px;font-size:13px;font-weight:500;cursor:pointer;max-width:230px;text-overflow:ellipsis}
.selw select.on{background:var(--accent-soft);color:var(--accent-ink)}
.selw .ico{position:absolute;right:11px;pointer-events:none;color:var(--ink-2)}
.tlist{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--tile);border-radius:var(--r-card);padding:16px 20px;cursor:pointer;box-shadow:var(--shadow);border:1px solid transparent;transition:border-color .15s, transform .15s;text-align:left;width:100%}
.trow:hover{border-color:var(--line)}
.trow.fresh{border-color:var(--accent)}
.trow .eb{font-size:12px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:3px}
.trow .eb .sep{opacity:.5}
.trow .ttl{font-size:16px;font-weight:600;line-height:1.32;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trow .who{font-size:13px;color:var(--ink-2);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.trow .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.price{font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.newtag{color:var(--orange);font-weight:600}
.empty{background:var(--tile);border-radius:var(--r-tile);padding:56px 24px;text-align:center;color:var(--ink-2)}
.empty h3{color:var(--ink);margin-bottom:6px}
.empty .actions{justify-content:center;margin-top:18px}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
.kcol{background:var(--fill-2);border-radius:var(--r-card);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:220px;border:2px solid transparent}
.kcol.over{border-color:var(--accent)}
.kcol-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px}
.kcard{background:var(--tile);border-radius:14px;padding:12px 14px;cursor:grab;box-shadow:var(--shadow);border:1px solid var(--hair);text-align:left;width:100%}
.kcard:active{cursor:grabbing}
.kcard .ttl{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.kcard.dragging{opacity:.4}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;top:12px;right:12px;bottom:12px;width:min(580px,calc(100vw - 24px));background:var(--tile);border-radius:24px;box-shadow:var(--shadow-lg);overflow-y:auto;overscroll-behavior:contain;transform:translateX(calc(100% + 24px));transition:transform .32s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:none}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 10px 24px;background:var(--tile)}
.sheet-b{padding:0 24px 32px}
.closeb{width:32px;height:32px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--ink-2)}
.closeb:hover{color:var(--ink)}
.sh-title{font-family:var(--f-display);font-size:26px;line-height:1.18;font-weight:700;letter-spacing:-.022em;margin:6px 0 8px;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--hair);border-radius:16px;overflow:hidden;margin:18px 0}
.fact{background:var(--tile-2);padding:12px 14px;min-width:0}
.fact .k{font-size:12px;color:var(--ink-2)}
.fact .v{font-size:15px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fact.wide{grid-column:span 2}
.blk{margin-top:26px}
.blk-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.blk-h h3{font-size:17px}
.stseg{display:flex;flex-wrap:wrap;gap:6px}
.stseg button{height:30px;padding:0 12px;border-radius:980px;font-size:12px;font-weight:600;background:var(--fill);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.stseg button i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}
.stseg button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px currentColor}
.stseg button.st-new[aria-pressed="true"]{color:var(--blue);background:var(--blue-bg)}
.stseg button.st-review[aria-pressed="true"]{color:var(--indigo);background:var(--indigo-bg)}
.stseg button.st-prep[aria-pressed="true"]{color:var(--orange);background:var(--orange-bg)}
.stseg button.st-submitted[aria-pressed="true"]{color:var(--purple);background:var(--purple-bg)}
.stseg button.st-won[aria-pressed="true"]{color:var(--green);background:var(--green-bg)}
.stseg button.st-lost[aria-pressed="true"]{color:var(--red);background:var(--red-bg)}
.stseg button.st-skipped[aria-pressed="true"]{color:var(--gray);background:var(--gray-bg)}
.stseg button[aria-pressed="true"] i{opacity:1}
.checks{display:flex;flex-direction:column;border-radius:14px;background:var(--tile-2);border:1px solid var(--hair);overflow:hidden}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--hair);font-size:14px}
.check:first-child{border-top:0}
.check .ico{margin-top:2px}
.check small{display:block;color:var(--ink-2);font-size:12px;margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:4px 10px;border-radius:980px;background:var(--fill);color:var(--ink)}
.ai-card{border-radius:18px;padding:18px;background:linear-gradient(var(--tile-2),var(--tile-2)) padding-box;border:1px solid var(--hair)}
.ai-top{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.ai-card ul{margin:6px 0 0;padding-left:18px}
.ai-card li{margin:4px 0}
.ai-sec{margin-top:14px}
.ai-sec h4{margin:0;font-size:13px;font-weight:600;color:var(--ink-2)}
.note{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--tile-2);padding:10px 12px;resize:vertical;outline:none}
.note:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.timeline{display:flex;flex-direction:column;gap:8px;font-size:13px}
.tl{display:flex;gap:10px;align-items:center}
.tl time{color:var(--ink-2);font-variant-numeric:tabular-nums;margin-left:auto}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--red-bg);border-radius:14px;padding:10px 12px;font-size:13px}
.dates{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.input{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--tile);padding:0 12px;font-size:14px;color:var(--ink);outline:none;min-width:0}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea.input{height:auto;padding:10px 12px;min-height:80px}

/* AI chat */
.chat{max-width:780px;margin:0 auto}
.suggest{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}
.sg{background:var(--tile);border-radius:18px;padding:16px 18px;text-align:left;box-shadow:var(--shadow);border:1px solid transparent;font-size:15px;font-weight:500;line-height:1.35}
.sg:hover{border-color:var(--line)}
.sg small{display:block;color:var(--ink-2);font-weight:400;font-size:13px;margin-top:4px}
.msgs{display:flex;flex-direction:column;gap:18px;margin:8px 0 24px}
.msg{max-width:100%;font-size:16px;line-height:1.6;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;max-width:82%;background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:20px 20px 6px 20px;white-space:pre-wrap}
.msg.ai p{margin:0 0 10px}
.msg.ai ul,.msg.ai ol{margin:0 0 10px;padding-left:22px}
.msg.ai li{margin:3px 0}
.msg.ai h4{font-size:16px;margin:14px 0 6px}
.msg .err{color:var(--red);font-size:13px;margin-top:6px}
.thinking{color:var(--ink-2);font-size:15px;display:flex;align-items:center;gap:8px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.dock{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--tile);border-radius:26px;padding:8px 8px 8px 18px;box-shadow:0 8px 30px rgba(0,0,0,.12);border:1px solid var(--hair)}
.dock textarea{flex:1;border:0;background:none;outline:none;resize:none;font-size:16px;line-height:1.45;padding:7px 0;max-height:160px;min-height:24px}
.sendb{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.sendb[disabled]{background:var(--fill);color:var(--ink-3)}
.ctx{font-size:12px;color:var(--ink-3);text-align:center;margin-top:10px}
.notice{background:var(--tile);border-radius:18px;padding:18px 20px;display:flex;gap:12px;align-items:flex-start;color:var(--ink-2);font-size:14px}
.notice b{color:var(--ink)}

/* Docs (grouped lists, Settings uslubi) */
.group{margin-top:30px}
.group-h{font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 8px 16px}
.glist{background:var(--tile);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.gitem{display:flex;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--hair);flex-wrap:wrap}
.gitem:first-child{border-top:0}
.gitem .main{flex:1;min-width:200px}
.gitem .t{font-size:15px;font-weight:500}
.gitem .d{font-size:13px;color:var(--ink-2);margin-top:1px}
.mini-seg{display:inline-flex;background:var(--fill);border-radius:980px;padding:2px;gap:2px}
.mini-seg button{height:26px;padding:0 10px;border-radius:980px;font-size:12px;font-weight:500;color:var(--ink-2)}
.mini-seg button[aria-pressed="true"].s-ready{background:var(--green-bg);color:var(--green)}
.mini-seg button[aria-pressed="true"].s-update{background:var(--orange-bg);color:var(--orange)}
.mini-seg button[aria-pressed="true"].s-missing{background:var(--red-bg);color:var(--red)}
.input.date{height:30px;font-size:13px;padding:0 8px;width:150px}

/* News */
.news-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.news{background:var(--tile);border-radius:var(--r-tile);padding:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.news.feat{grid-column:span 2;padding:34px}
.news.feat h3{font-size:28px;line-height:1.16;letter-spacing:-.022em}
.news .eb{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kind{font-weight:600}
.kind.law{color:var(--purple)} .kind.industry{color:var(--accent-ink)}
.news p{margin:0;color:var(--ink-2);font-size:15px;text-wrap:pretty}
.impact{background:var(--fill-2);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.impact b{display:block;font-size:12px;color:var(--ink-2);font-weight:600;margin-bottom:2px}

/* Finance */
.chart-scroll{overflow-x:auto;margin:0 -6px}
.chart{display:block;width:100%;min-width:520px;height:auto}
.chart text{fill:var(--ink-2);font-size:12px;font-family:var(--f-text)}
.chart .grid{stroke:var(--hair);stroke-width:1}
.chart .goal{stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:5 5;fill:none}
.chart .val{fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chart .hit{fill:transparent}
.chart .dim{opacity:.45}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--hair);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:700;border-bottom:0}
.month-sw{display:inline-flex;align-items:center;gap:4px;background:var(--fill);border-radius:980px;padding:3px}
.month-sw button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.month-sw button:hover{background:var(--tile)}
.month-sw span{font-size:14px;font-weight:600;min-width:120px;text-align:center}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.breakdown{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.bd{display:flex;align-items:center;gap:10px;font-size:15px}
.bd i{width:10px;height:10px;border-radius:3px;flex:none}
.bd .x{color:var(--ink-2);font-size:13px}
.bd b{margin-left:auto;font-variant-numeric:tabular-nums}
.switch{position:relative;width:46px;height:28px;border-radius:14px;background:var(--fill);transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:#34c759}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* Settings */
.kw{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px}
.kw .tag{display:inline-flex;align-items:center;gap:4px;padding:4px 6px 4px 11px;font-size:13px}
.kw .tag button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.kw .tag button:hover{background:var(--line)}
.kw-add{display:flex;gap:8px;padding:0 16px 14px}
.dirs{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px;padding:16px}
.step{display:flex;gap:12px;font-size:14px;align-items:flex-start}
.step::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.about{display:flex;gap:18px;align-items:center;padding:20px 16px}

/* Modal */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.dialog{background:var(--tile);border-radius:24px;width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow-lg);padding:24px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.form .wide{grid-column:span 2}
.form .field .input{width:100%}

/* Toast, tooltip, tab bar */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:980px;font-size:14px;font-weight:500;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tip{position:fixed;z-index:95;pointer-events:none;background:var(--tile);color:var(--ink);border:1px solid var(--hair);box-shadow:var(--shadow-lg);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5;opacity:0;transition:opacity .12s;min-width:180px}
.tip.on{opacity:1}
.tip b{font-size:13px}
.tip .tr{display:flex;align-items:center;gap:6px}
.tip .tr i{width:8px;height:8px;border-radius:2px}
.tip .tr span{margin-left:auto;padding-left:12px;font-variant-numeric:tabular-nums}
.tabbar{display:none}
.skel{background:var(--fill);border-radius:12px;height:16px;animation:blink 1.6s infinite}
.fade{animation:fadeup .35s ease both}
@keyframes fadeup{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

@media (max-width: 980px){
  .gnav-links{display:none}
  .gnav-in{justify-content:space-between}
  .c-3{grid-column:span 6}.c-4,.c-5,.c-6,.c-7,.c-8{grid-column:span 12}
  .r-2{grid-row:auto}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--hair);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--ink-2);padding:4px 0;position:relative}
  .tabbar a:hover{text-decoration:none}
  .tabbar [aria-current="page"]{color:var(--accent-ink)}
  .tabbar .badge{position:absolute;top:0;left:calc(50% + 6px);height:16px;min-width:16px;font-size:10px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .dock{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (max-width: 640px){
  .wrap{padding-inline:16px;padding-block:24px 120px}
  .gnav-in{padding-inline:16px}
  h1{font-size:34px}
  .sub{font-size:17px}
  .c-3{grid-column:span 12}
  .num-xl{font-size:44px} .num-l{font-size:36px}
  .tile{padding:20px}
  .trow{grid-template-columns:44px minmax(0,1fr);gap:12px;padding:14px 16px}
  .trow .end{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:10px;text-align:left}
  .sheet{top:auto;left:0;right:0;bottom:0;width:100%;height:calc(100% - 36px);border-radius:22px 22px 0 0;transform:translateY(100%)}
  .sheet-b{padding:0 18px 40px}
  .sheet-h{padding:12px 14px 8px 18px}
  .suggest{grid-template-columns:1fr}
  .news-grid{grid-template-columns:1fr}
  .news.feat{grid-column:auto;padding:24px}
  .news.feat h3{font-size:22px}
  .form{grid-template-columns:1fr}
  .form .wide{grid-column:auto}
  .fbar{grid-template-columns:110px 1fr 24px}
  .live .lbl{display:none}
}

/* ===================== Liquid Glass ===================== */
/* Layout: sekin oqayotgan rangli fon ustida suzuvchi shisha kapsula navigatsiya va shisha bento plitalar; tafsilotlar qalin shisha varaqda. */
:root{
  --bg:#e8edf5;
  --amb-1:rgba(0,122,255,.34); --amb-2:rgba(90,200,250,.42); --amb-3:rgba(255,159,10,.26); --amb-4:rgba(255,55,95,.15); --amb-5:rgba(52,199,89,.2);
  --glass:rgba(255,255,255,.5); --glass-strong:rgba(255,255,255,.72); --glass-soft:rgba(255,255,255,.3); --glass-press:rgba(255,255,255,.9);
  --rim-1:rgba(255,255,255,.95); --rim-2:rgba(255,255,255,.28); --shade:rgba(15,23,42,.06); --spec:rgba(255,255,255,.7);
  --glass-shadow:0 1px 1px rgba(15,23,42,.04),0 10px 30px rgba(15,23,42,.08);
  --shadow-lg:0 30px 80px rgba(15,23,42,.24);
  --blur:saturate(180%) blur(14px); --blur-strong:saturate(190%) blur(16px); /* Chromium 16px dan katta backdrop blur'ni ba'zan chizmaydi */
  --tile:var(--glass); --tile-2:rgba(255,255,255,.42);
  --fill:rgba(118,118,128,.14); --fill-2:rgba(118,118,128,.08);
  --ink:#1d1d1f; --ink-2:#55555b; --ink-3:#76767c; --line:rgba(60,60,67,.2); --hair:rgba(60,60,67,.12);
  --nav:var(--glass-strong); --scrim:rgba(20,24,33,.2);
  --primary-top:#3b95ff; --primary-bot:#0071e3; --primary-glow:rgba(0,113,227,.32);
  --toast-bg:rgba(28,28,30,.8); --toast-ink:#ffffff; --menu-bg:#ffffff; --menu-ink:#1d1d1f;
  --r-tile:28px; --r-card:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#04060b;
    --amb-1:rgba(10,132,255,.42); --amb-2:rgba(100,210,255,.2); --amb-3:rgba(255,159,10,.17); --amb-4:rgba(255,55,95,.2); --amb-5:rgba(48,209,88,.15);
    --glass:rgba(42,42,48,.44); --glass-strong:rgba(26,26,30,.7); --glass-soft:rgba(255,255,255,.07); --glass-press:rgba(255,255,255,.2);
    --rim-1:rgba(255,255,255,.34); --rim-2:rgba(255,255,255,.06); --shade:rgba(0,0,0,.25); --spec:rgba(255,255,255,.14);
    --glass-shadow:0 1px 1px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);
    --shadow-lg:0 30px 80px rgba(0,0,0,.7);
    --tile:var(--glass); --tile-2:rgba(255,255,255,.05);
    --fill:rgba(118,118,128,.26); --fill-2:rgba(118,118,128,.14);
    --ink:#f5f5f7; --ink-2:#b0b0b6; --ink-3:#8e8e93; --line:rgba(255,255,255,.16); --hair:rgba(255,255,255,.09);
    --nav:var(--glass-strong); --scrim:rgba(0,0,0,.45);
    --primary-top:#3aa0ff; --primary-bot:#0a7cff; --primary-glow:rgba(10,132,255,.38);
    --toast-bg:rgba(245,245,247,.88); --toast-ink:#1d1d1f; --menu-bg:#2c2c2e; --menu-ink:#f5f5f7;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#04060b;
  --amb-1:rgba(10,132,255,.42); --amb-2:rgba(100,210,255,.2); --amb-3:rgba(255,159,10,.17); --amb-4:rgba(255,55,95,.2); --amb-5:rgba(48,209,88,.15);
  --glass:rgba(42,42,48,.44); --glass-strong:rgba(26,26,30,.7); --glass-soft:rgba(255,255,255,.07); --glass-press:rgba(255,255,255,.2);
  --rim-1:rgba(255,255,255,.34); --rim-2:rgba(255,255,255,.06); --shade:rgba(0,0,0,.25); --spec:rgba(255,255,255,.14);
  --glass-shadow:0 1px 1px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);
  --shadow-lg:0 30px 80px rgba(0,0,0,.7);
  --tile:var(--glass); --tile-2:rgba(255,255,255,.05);
  --fill:rgba(118,118,128,.26); --fill-2:rgba(118,118,128,.14);
  --ink:#f5f5f7; --ink-2:#b0b0b6; --ink-3:#8e8e93; --line:rgba(255,255,255,.16); --hair:rgba(255,255,255,.09);
  --nav:var(--glass-strong); --scrim:rgba(0,0,0,.45);
  --primary-top:#3aa0ff; --primary-bot:#0a7cff; --primary-glow:rgba(10,132,255,.38);
  --toast-bg:rgba(245,245,247,.88); --toast-ink:#1d1d1f; --menu-bg:#2c2c2e; --menu-ink:#f5f5f7;
  color-scheme:dark;
}

/* Rangli fon: shisha ortida sekin siljiydigan yorug'lik dog'lari */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--bg)}
.ambient i{position:absolute;border-radius:50%;will-change:transform}
.ambient .a1{width:70vmax;height:70vmax;left:-24vmax;top:-30vmax;background:radial-gradient(circle,var(--amb-1),transparent 66%);animation:drift1 46s ease-in-out infinite alternate}
.ambient .a2{width:58vmax;height:58vmax;right:-20vmax;top:-12vmax;background:radial-gradient(circle,var(--amb-2),transparent 66%);animation:drift2 52s ease-in-out infinite alternate}
.ambient .a3{width:62vmax;height:62vmax;left:18vmax;bottom:-38vmax;background:radial-gradient(circle,var(--amb-3),transparent 66%);animation:drift3 58s ease-in-out infinite alternate}
.ambient .a4{width:44vmax;height:44vmax;right:-10vmax;bottom:-14vmax;background:radial-gradient(circle,var(--amb-4),transparent 66%);animation:drift2 64s ease-in-out infinite alternate-reverse}
.ambient .a5{width:40vmax;height:40vmax;left:-12vmax;bottom:-6vmax;background:radial-gradient(circle,var(--amb-5),transparent 66%);animation:drift1 70s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate3d(9vmax,7vmax,0) scale(1.08)}}
@keyframes drift2{to{transform:translate3d(-8vmax,9vmax,0) scale(1.12)}}
@keyframes drift3{to{transform:translate3d(6vmax,-8vmax,0) scale(1.06)}}
#ribbon{position:relative;z-index:2;padding-inline:16px}
.wrap{position:relative;z-index:1}

/* Shisha material: yarim shaffof qatlam, chekka nuri, ichki soya va yorug'lik aksi */
.tile,.trow,.news,.glist,.empty,.notice,.sg,.kcard,.dialog,.sheet,.gnav-in,.tabbar,.dock,.ribbon,.toast,.tip{
  background:var(--glass);border:0;
  box-shadow:inset 0 0 0 1px var(--rim-2),inset 0 1px 0 var(--rim-1),inset 0 -1px 0 var(--shade),var(--glass-shadow);
}
.tile,.news,.glist,.empty,.notice,.sg,.dock,.ribbon,.tip,.kcol,.month-sw{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.gnav-in,.tabbar,.sheet,.dialog,.toast{-webkit-backdrop-filter:var(--blur-strong);backdrop-filter:var(--blur-strong)}
.tile,.trow,.news,.empty,.notice,.sg,.kcard,.dialog,.gnav-in,.glist{position:relative;isolation:isolate}
.sheet,.tabbar{isolation:isolate}
.tile::before,.trow::before,.news::before,.sg::before,.kcard::before,.dialog::before,.sheet::before,.gnav-in::before,.tabbar::before,.empty::before,.notice::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(130% 85% at var(--mx,18%) var(--my,-18%),var(--spec),transparent 58%);
  opacity:.85;transition:opacity .35s ease;
}

/* ---------- Saqlash qatlami: Claude ichida — db, lokal — brauzer xotirasi ---------- */
const LS = 'winder:data:';
const Store = {
  mode: 'loading', db: null, local: {},
  async init() {
    let db = null;
    if (window.claude && typeof window.claude.use === 'function') {
      try { db = await window.claude.use('db'); } catch (e) { db = null; }
    }
    this.mode = db ? 'cloud' : 'local';
    this.db = db;
  },
  watch(col, cb) {
    if (this.mode === 'cloud') {
      return this.db.collection(col).onSnapshot(
        snap => cb(snap.docs.map(d => ({ ...d.data(), id: d.id }))),
        err => { console.warn(col, err); if (err && err.code !== 'revoked') toast('Jonli ulanish uzildi. Sahifani yangilang.'); }
      );
    }
    this.local[col] = () => cb(this.list(col));
    this.local[col]();
    return () => {};
  },
  read(col) { try { return JSON.parse(localStorage.getItem(LS + col) || '{}') || {}; } catch (e) { return {}; } },
  write(col, obj) {
    try { localStorage.setItem(LS + col, JSON.stringify(obj)); } catch (e) { toast('Brauzer xotirasiga yozib bo‘lmadi'); }
    if (this.local[col]) this.local[col]();
  },
  list(col) { const o = this.read(col); return Object.keys(o).map(id => ({ ...o[id], id })); },
  async set(col, id, data) {
    const body = strip(data);
    if (this.mode === 'cloud') return this.db.collection(col).doc(id).set(body);
    const o = this.read(col); o[id] = body; this.write(col, o);
  },
  async update(col, id, patch) {
    if (this.mode === 'cloud') return this.db.collection(col).doc(id).update(patch);
    const o = this.read(col); o[id] = deepMerge(o[id] || {}, patch); this.write(col, o);
  },
  async remove(col, id) {
    if (this.mode === 'cloud') return this.db.collection(col).doc(id).delete();
    const o = this.read(col); delete o[id]; this.write(col, o);
  },
};
window.addEventListener('storage', e => {
  if (e.key && e.key.startsWith(LS)) { const c = e.key.slice(LS.length); if (Store.local[c]) Store.local[c](); }
});
function strip(d) { const o = { ...d }; delete o.id; return o; }
function deepMerge(a, b) {
  const out = { ...a };
  for (const k of Object.keys(b)) {
    const v = b[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && out[k] && typeof out[k] === 'object' && !Array.isArray(out[k])) out[k] = deepMerge(out[k], v);
    else out[k] = v;
  }
  return out;
}

    toast(code === 'quota_exceeded' ? 'Ma’lumotlar bazasi to‘ldi: eski yozuvlarni o‘chiring.'
      : code === 'invalid_argument' ? 'Saqlanmadi: bu sahifani tahrirlash huquqingiz yo‘q.'
      : 'Saqlanmadi. Bir ozdan so‘ng qayta urinib ko‘ring.');

}

  const d = D(iso), now = new Date();
  const day = 864e5, t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() - t0) / day);

}

}

function md(text) {
  const lines = esc(text).split('\n');
  let html = '', list = null;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const l = raw.trim();
    let m;
    if (!l) { close(); continue; }
    if ((m = l.match(/^#{1,4}\s+(.*)$/))) { close(); html += `<h4>${inline(m[1])}</h4>`; }
    else if ((m = l.match(/^[-*•]\s+(.*)$/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; }
    else { close(); html += `<p>${inline(l)}</p>`; }
  }
  close();
  return html;
}

function finance(month) {
  const s = S.settings;

  const salary = Number(s.salary) || 0, ps = Number(s.perSubmitted) || 0, pw = Number(s.perWon) || 0;
  return { month, salary, sub, won, subSum: sub.length * ps, wonSum: won.length * pw, total: salary + sub.length * ps + won.length * pw };
}
function winRate() {
  const won = S.tenders.filter(t => t.status === 'won').length, lost = S.tenders.filter(t => t.status === 'lost').length;
  return won + lost ? won / (won + lost) : null;
}

/* ---------- Tender moslik bahosi (qo‘lda qo‘shilganlar uchun) ---------- */
function scoreMatch(text) {
  const t = String(text || '').toLowerCase();
  const kws = (S.settings.keywords || []).map(k => String(k).toLowerCase()).filter(Boolean);
  const hits = kws.filter(k => t.includes(k));
  const bad = (S.settings.exclude || []).some(k => k && t.includes(String(k).toLowerCase()));
  let dir = 'IT xizmatlari', best = 0;
  for (const [d, hs] of Object.entries(DIR_HINTS)) { const n = hs.filter(h => t.includes(h)).length; if (n > best) { best = n; dir = d; } }
  const score = bad ? 25 : Math.min(97, 45 + hits.length * 14 + best * 6);
  return { score, hits, dir };
}

    if (f.status !== 'active' && f.status !== 'all' && t.status !== f.status) return false;
    if (f.source && t.source !== f.source) return false;
    if (f.dir && t.direction !== f.dir) return false;
    if (f.type && t.type !== f.type) return false;
    if (f.region && !String(t.region || '').startsWith(f.region)) return false;
    if (+f.minMatch && (Number(t.match) || 0) < +f.minMatch) return false;
    if (f.due) {
      const ms = D(t.deadline) - now;
      if (f.due === 'over' ? ms > 0 : !(ms > 0 && ms <= Number(f.due) * 864e5)) return false;
    }
    if (q) {
      const hay = [t.title, t.customer, t.region, t.lot, t.oferta, t.type, srcName(t.source), t.direction].join(' ').toLowerCase();
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
  const by = {
    match: (a, b) => (b.match || 0) - (a.match || 0),
    deadline: (a, b) => dlKey(a) - dlKey(b),
    price: (a, b) => toUZS(b) - toUZS(a),
    found: (a, b) => D(b.foundAt) - D(a.foundAt),
  }[f.sort] || (() => 0);
  return list.sort(by);
}
function dlKey(t) { const v = D(t.deadline).getTime() - Date.now(); return v > 0 ? v : 1e15 - v; }
const regionOf = t => String(t.region || '').split(',')[0].trim();

async function sendChat(text) {
  text = String(text || '').trim();
  if (!text || S.chatBusy || !S.sample) return;
  delete S.drafts.chat;
  S.chat.push({ role: 'user', content: text });
  const reply = { role: 'assistant', content: '', pending: true };
  S.chat.push(reply);
  S.chatBusy = true;
  const ctl = new AbortController(); S.chatCtl = ctl;
  render(); scrollChat();
  const turns = [{ role: 'user', content: chatRules() }];
  for (const m of S.chat.slice(0, -1).slice(-12)) if (m.content) turns.push({ role: m.role, content: m.content });
  try {
    const res = await S.sample(turns, {
      cache: false, signal: ctl.signal,
      onText: ({ text: t }) => { reply.content = t; const el = $('msgLast'); if (el) el.innerHTML = md(t); scrollChat(); },
    });
    reply.content = res.text;
    if (res.truncated) reply.note = 'Javob uzunlik chegarasida to‘xtadi — savolni qismlarga bo‘ling.';
  } catch (e) {
    reply.content = e && e.code === 'refused' ? '' : (e && e.text) || reply.content;
    if (!(e && e.code === 'cancelled')) reply.error = sampleErr(e);
    if (e && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e.code)) S.sample = null;
  }
  reply.pending = false;
  S.chatBusy = false; S.chatCtl = null;
  render(); scrollChat();
}
function sampleErr(e) {
  const c = e && e.code;
  return {
    not_granted: 'Claude’dan foydalanishga ruxsat berilmadi.',
    rate_limited: 'So‘rovlar ko‘payib ketdi. Birozdan keyin qayta urinib ko‘ring.',
    session_expired: 'Claude hisobingizga qayta kiring.',
    refused: 'Claude bu so‘rovga javob bermadi. Savolni boshqacha yozing.',
    prompt_too_large: 'Ma’lumot juda katta. Savolni qisqartiring.',
    invalid_json: 'AI javobini o‘qib bo‘lmadi. Qayta urinib ko‘ring.',
    empty_completion: 'Javob bo‘sh qaytdi. Qayta urinib ko‘ring.',
  }[c] || 'Claude bilan aloqa uzildi. Qayta urinib ko‘ring.';
}
function scrollChat() { requestAnimationFrame(() => { const m = $('msgs'); if (m) window.scrollTo({ top: document.body.scrollHeight, behavior: 'auto' }); }); }

async function analyze(id) {
  const t = S.tenders.find(x => x.id === id);
  if (!t || !S.sample || S.aiBusy[id]) return;
  S.aiBusy[id] = true; delete S.aiErr[id]; render();
  const lib = S.docs.map(d => ({ id: d.id, nomi: d.name, holat: effState(d), muddat: d.expires || null }));
  const tender = { nomi: t.title, platforma: srcName(t.source), turi: t.type, lot: t.lot, buyurtmachi: t.customer, hudud: t.region, narx: money(t.price, t.currency),
    moliyalashtirish: t.funding, hujjat_tili: t.lang, takliflar_soni: t.offers, muddat: t.deadline, yonalish: t.direction, tavsif: t.description, talab_hujjatlar: t.req && t.req.docs, talab_konikmalar: t.req && t.req.skills, izoh: t.note };
  const prompt = `Sen O‘zbekiston davlat va korporativ xaridlari bo‘yicha tajribali tender maslahatchisisan. Kompaniya: ${S.settings.company}. Yo‘nalishlari: ${(S.settings.directions || []).join(', ')}. Bugun: ${new Date().toISOString().slice(0, 10)}.
Kompaniyaning hujjatlar kutubxonasi (holat: ready=tayyor, update=yangilash kerak, missing=yo‘q): ${JSON.stringify(lib)}
Tender: ${JSON.stringify(tender)}
Vazifa: bu tenderda qatnashish uchun zarur hujjatlar va ko‘nikmalarni aniqlab, kutubxona bilan solishtir, xavflarni ayt va yutish imkoniyatini oshirish bo‘yicha amaliy tavsiyalar ber. Hammasi o‘zbek tilida (lotin), qisqa.
Faqat bitta JSON obyekt qaytar, boshqa matn yozma:
{"summary": "2-3 gapli xulosa", "chance": 0-100 butun son, "docs": [{"name": "hujjat nomi", "state": "ready|update|missing", "note": "qisqa izoh"}], "skills": ["..."], "risks": ["..."], "tips": ["..."], "price": "narx strategiyasi bir gapda", "next": "eng muhim keyingi qadam"}`;
  try {
    const r = await S.sample.json(prompt, { modelTier: 'default' });
    if (!r || typeof r !== 'object' || typeof r.summary !== 'string') throw { code: 'invalid_json' };
    const arr = (a, n = 8) => (Array.isArray(a) ? a.filter(x => typeof x === 'string').slice(0, n) : []);
    const ai = {
      summary: String(r.summary).slice(0, 1200), chance: Math.max(0, Math.min(100, Math.round(Number(r.chance) || 0))),
      docs: Array.isArray(r.docs) ? r.docs.filter(d => d && d.name).slice(0, 14).map(d => ({ name: String(d.name), state: ['ready', 'update', 'missing'].includes(d.state) ? d.state : 'missing', note: String(d.note || '') })) : [],
      skills: arr(r.skills), risks: arr(r.risks), tips: arr(r.tips), price: String(r.price || ''), next: String(r.next || ''), at: new Date().toISOString(),
    };
    await save(() => Store.update('tenders', id, { ai }), 'AI tahlil saqlandi');
  } catch (e) {
    S.aiErr[id] = sampleErr(e);
    if (e && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e.code)) S.sample = null;
  }
  delete S.aiBusy[id]; render();
}

function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function topRound(x, y, w, h, r) {
  r = Math.min(r, h, w / 2);
  return `M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h} Z`;
}
function chart(months, sel) {
  const W = 680, H = 280, L = 56, R = 16, T = 26, B = 34;
  const goal = Number(S.settings.goal) || 0;
  const maxV = Math.max(goal, ...months.map(m => m.total), 1);
  const step = niceStep(maxV / 4), top = Math.ceil(maxV / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const n = months.length, slot = (W - L - R) / n, bw = Math.min(54, slot * .52);
  let g = '';
  for (let v = 0; v <= top + 1; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v ? short(v) : '0'}</text>`;
  const bars = months.map((m, i) => {
    const cx = L + slot * (i + .5), x = cx - bw / 2;
    const segs = [[m.salary, 'var(--s1)'], [m.subSum, 'var(--s2)'], [m.wonSum, 'var(--s3)']].filter(s => s[0] > 0);
    let acc = 0, out = '';
    segs.forEach(([v, c], j) => {
      const y0 = y(acc), y1 = y(acc + v), last = j === segs.length - 1;
      const hgt = Math.max(0, y0 - y1 - (j > 0 ? 2 : 0));
      out += last ? `<path d="${topRound(x, y1, bw, hgt, 4)}" fill="${c}"/>` : `<rect x="${x}" y="${y1}" width="${bw}" height="${hgt}" fill="${c}"/>`;
      acc += v;
    });
    const [yy, mm] = m.month.split('-').map(Number);
    const tip = `<b>${MONTHS[mm - 1]} ${yy}</b>|s1|Fiks oylik|${grp(m.salary)}|s2|Topshirilgan (${m.sub.length})|${grp(m.subSum)}|s3|Yutilgan (${m.won.length})|${grp(m.wonSum)}|Jami|${grp(m.total)}`;
    return `<g class="${m.month === sel ? '' : 'dim'}">${out}<text class="val" x="${cx}" y="${y(m.total) - 8}" text-anchor="middle">${short(m.total)}</text></g>
      <text x="${cx}" y="${H - 10}" text-anchor="middle" style="${m.month === sel ? 'fill:var(--ink);font-weight:600' : ''}">${MON3[mm - 1]}</text>
      <rect class="hit" x="${cx - slot / 2}" y="${T}" width="${slot}" height="${H - T - B}" data-tip="${esc(tip)}" data-act="finMonth" data-m="${m.month}"/>`;
  }).join('');
  const goalLine = goal ? `<line class="goal" x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}"/><text x="${W - R}" y="${y(goal) - 6}" text-anchor="end">Maqsad ${short(goal)}</text>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Oxirgi ${n} oy daromadi">${g}${bars}${goalLine}</svg>`;
}

async function submitAdd() {
  const g = k => String(val(k) || '').trim();
  const editId = S.modal && S.modal.startsWith('edit:') ? S.modal.slice(5) : null;
  const title = g('f-title'), dl = g('f-deadline');
  if (!title || !dl) { toast('Tender nomi va tugash sanasini kiriting'); return; }
  const deadline = new Date(dl);
  if (isNaN(deadline)) { toast('Tugash sanasini to‘g‘ri kiriting'); return; }
  const source = g('f-source') || 'xarid';
  const desc = g('f-desc');
  const m = scoreMatch(title + ' ' + desc);
  const manualMatch = g('f-match') === '' ? null : Math.max(0, Math.min(100, Math.round(Number(g('f-match').replace(',', '.')) || 0)));
  const offers = g('f-offers') === '' ? null : Number(g('f-offers').replace(/[^\d]/g, '')) || 0;
  const url = /^https?:\/\//i.test(g('f-url')) ? g('f-url') : (SOURCES[source] || {}).url || '';
  const data = {
    title, source, type: g('f-type') || (TYPES_BY_SOURCE[source] || ['Tender'])[0], lot: g('f-lot') || '—', customer: g('f-customer') || '—', region: g('f-region') || '—',
    price: Number(g('f-price').replace(/[^\d.]/g, '')) || 0, currency: g('f-currency') || 'UZS', funding: g('f-funding'), lang: g('f-lang'), offers,
    deadline: deadline.toISOString(), direction: g('f-direction') || m.dir, description: desc, url,
  };
  if (source === 'coop') data.oferta = g('f-oferta');
  if (editId) {
    const t = S.tenders.find(x => x.id === editId);
    if (!t) { toast('Tender topilmadi'); return; }
    if (manualMatch != null) data.match = manualMatch;
    else if (t.title !== title || (t.description || '') !== desc) Object.assign(data, { match: m.score, reasons: m.hits.slice(0, 6) });
    const ok = await save(() => Store.update('tenders', editId, data), 'O‘zgarishlar saqlandi');
    if (ok) { clearFormDrafts(); S.modal = null; render(); }
    return;
  }
  const now = new Date().toISOString();
  const id = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const t = {
    ...data, publishedAt: now, match: manualMatch != null ? manualMatch : m.score, reasons: m.hits.slice(0, 6), req: { docs: [], skills: [] },
    status: 'new', history: [{ s: 'new', at: now }], submittedAt: null, wonAt: null, lostAt: null, note: '', ai: null, foundAt: now, sample: false, manual: true,
  };
  S.selfAdded.add(id);
  const ok = await save(() => Store.set('tenders', id, t), 'Tender qo‘shildi');
  if (ok) { clearFormDrafts(); S.modal = null; S.sel = id; render(); }
}

  const amount = Math.round((Number(t.price) || 0) * pct / 100);
  const state = pct > 0 ? (z.state && z.state !== 'none' ? z.state : 'due') : 'none';
  return { pct, amount, state, custom, base, uzs: uzsOf(t, amount) };
}
function zakSummary() {

function listText(list) {
  const today = new Date();
  let out = `📋 Tenderlar · ${today.getDate()}-${MONTHS[today.getMonth()]} · ${list.length} ta`;
  let n = 0;
  for (const t of list) {
    const b = [`${n + 1}. ${t.title}`];
    b.push(`${srcName(t.source)}${has(t.type) ? ' · ' + t.type : ''}${has(t.lot) ? ' · lot ' + t.lot : ''}`);
    const money1 = t.price > 0 ? `💰 ${money(t.price, t.currency)}` : '';
    const dl = deadlineLine(t.deadline);
    b.push([money1, dl ? `⏰ ${dl}` : ''].filter(Boolean).join(' · '));
    b.push([has(t.customer) ? `🏛 ${t.customer}` : '', `📊 ${(ST[t.status] || {}).l || t.status}`].filter(Boolean).join(' · '));
    const link = httpUrl(t.url);
    if (link) b.push(`🔗 ${link}`);
    const block = b.filter(Boolean).join('\n');
    if ((out + '\n\n' + block).length > TG_LIMIT - 40) break;
    out += '\n\n' + block; n++;
  }
  if (n < list.length) out += `\n\n… va yana ${list.length - n} ta tender`;
  return out;
}

function hbars(groups) {

  }).join('')}</div>`;
}
function monthBars(rows) {
  const W = 640, H = 230, L = 32, R = 8, T = 24, B = 30;
  const max = Math.max(1, ...rows.map(r => Math.max(r.sub, r.won)));
  const step = max <= 4 ? 1 : niceStep(max / 4), top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const slot = (W - L - R) / rows.length, bw = Math.min(26, slot * 0.28);
  const bars = rows.map((r, i) => {
    const cx = L + slot * (i + 0.5), mm = Number(r.key.split('-')[1]);
    const b = (v, x, cls) => (v > 0 ? `<path class="${cls}" d="${topRound(x, y(v), bw, y(0) - y(v), 4)}"/><text class="val" x="${x + bw / 2}" y="${y(v) - 6}" text-anchor="middle">${v}</text>` : '');
    return b(r.sub, cx - bw - 1.5, 'mb-s') + b(r.won, cx + 1.5, 'mb-w') + `<text x="${cx}" y="${H - 10}" text-anchor="middle">${MON3[mm - 1]}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Oxirgi 6 oy: topshirilgan va yutilgan tenderlar">${g}${bars}</svg>`;
}

function celebrate(title) {

  document.body.appendChild(card);
  requestAnimationFrame(() => card.classList.add('on'));
  setTimeout(() => { card.classList.remove('on'); setTimeout(() => card.remove(), 450); }, 2600);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--s1', '--s2', '--s3', '--accent', '--purple', '--orange'].map(v => cs.getPropertyValue(v).trim() || '#0a84ff');
  const P = Array.from({ length: 160 }, () => ({ x: W / 2 + (Math.random() - 0.5) * 160, y: H * 0.36, vx: (Math.random() - 0.5) * 13, vy: -Math.random() * 13 - 4, r: 5 + Math.random() * 5, a: Math.random() * 6.28, va: (Math.random() - 0.5) * 0.3, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  const frame = now => {
    const dt = now - t0;
    ctx.clearRect(0, 0, W, H);
    for (const p of P) {
      p.vy += 0.3; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.globalAlpha = Math.max(0, 1 - dt / 2300); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
    }
    if (dt < 2300) requestAnimationFrame(frame); else c.remove();
  };
  requestAnimationFrame(frame);
}

/* ---------- Telefon: surish imo-ishoralari ---------- */
const NEXT_STAGE = { new: 'review', review: 'prep', prep: 'submitted' };
let swipe = null, swipeLock = false, sheetDrag = null;
document.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  const tc = e.touches[0];
  const row = e.target.closest && e.target.closest('.trow');
  if (row) swipe = { el: row, x: tc.clientX, y: tc.clientY, dx: 0, lock: null };
  const head = e.target.closest && e.target.closest('.sheet-h');
  if (head && window.innerWidth <= 640 && !e.target.closest('button')) sheetDrag = { el: $('sheet'), y: tc.clientY, dy: 0 };
}, { passive: true });
document.addEventListener('touchmove', e => {
  const tc = e.touches[0];
  if (swipe) {
    const dx = tc.clientX - swipe.x, dy = tc.clientY - swipe.y;
    if (swipe.lock == null && Math.abs(dx) + Math.abs(dy) > 10) swipe.lock = Math.abs(dx) > Math.abs(dy) * 1.3 ? 'x' : 'y';
    if (swipe.lock === 'x') {
      const t = S.tenders.find(x => x.id === swipe.el.dataset.id);
      if (!t || !NEXT_STAGE[t.status]) return;
      swipe.dx = Math.max(0, Math.min(140, dx));
      swipe.el.style.transition = 'none';
      swipe.el.style.transform = `translateX(${swipe.dx}px)`;
      swipe.el.classList.toggle('swipe-ready', swipe.dx > 90);
      swipe.el.dataset.next = ST[NEXT_STAGE[t.status]].l;
    }
  }
  if (sheetDrag) {
    sheetDrag.dy = Math.max(0, tc.clientY - sheetDrag.y);
    sheetDrag.el.style.transition = 'none';
    sheetDrag.el.style.transform = `translateY(${sheetDrag.dy}px)`;
  }
}, { passive: true });
document.addEventListener('touchend', () => {
  if (swipe) {
    const { el, dx } = swipe; swipe = null;
    el.style.transition = ''; el.style.transform = ''; el.classList.remove('swipe-ready');
    if (dx > 90) {
      const t = S.tenders.find(x => x.id === el.dataset.id);
      swipeLock = true; setTimeout(() => { swipeLock = false; }, 400);
      if (t && NEXT_STAGE[t.status]) setStatus(t.id, NEXT_STAGE[t.status]);
    }
  }
  if (sheetDrag) {
    const { el, dy } = sheetDrag; sheetDrag = null;
    el.style.transition = ''; el.style.transform = '';
    if (dy > 120) closeSheet();
  }
});

/* ---------- Amallar ---------- */
async function setStatus(id, s) {
  const t = S.tenders.find(x => x.id === id);
  if (!t || t.status === s || !ST[s]) return;
  const now = new Date().toISOString();
  const patch = { status: s, history: [...(t.history || []), { s, at: now }] };
  if (STAGE[s] < 3) Object.assign(patch, { submittedAt: null, wonAt: null, lostAt: null });
  if (s === 'submitted') Object.assign(patch, { submittedAt: t.submittedAt || now, wonAt: null, lostAt: null });
  if (s === 'won') Object.assign(patch, { submittedAt: t.submittedAt || now, wonAt: t.wonAt || now, lostAt: null });
  if (s === 'lost') Object.assign(patch, { submittedAt: t.submittedAt || now, lostAt: t.lostAt || now, wonAt: null });
  if (s === 'won') {
    const r = resultOf(t);
    if (!r.winner || !isUs(r.winner)) patch.result = { winner: S.settings.company || 'Biz', winnerPrice: r.ourPrice != null ? r.ourPrice : null };
  }
  const ok = await save(() => Store.update('tenders', id, patch), s === 'won' ? null : `Holat: ${ST[s].l}`);
  if (ok && s === 'won') celebrate(t.title);
}
async function saveSettings(patch) {
  const next = { ...S.settings, ...patch };
  S.settings = next; render();
  await save(() => Store.set('settings', 'main', next));
}
async function exportFile(name, data, mime) {
  if (S.downloads) {
    try { await S.downloads.save({ filename: name, data }); }
    catch (e) { if (e && e.code !== 'declined') toast('Faylni saqlab bo‘lmadi'); }
    return;
  }
  if (S.mode === 'local') {
    const url = URL.createObjectURL(new Blob([data], { type: mime }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return;
  }
  toast('Faylni yuklab olish bu ko‘rinishda mavjud emas');
}
function csv() {
  const cols = ['Lot', 'Nomi', 'Platforma', 'Turi', 'Buyurtmachi', 'Hudud', 'Narx', 'Valyuta', 'Tugash sanasi', 'Moslik', 'Holat', 'Topshirilgan', 'Yutilgan', 'Havola'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = filtered().map(t => [t.lot, t.title, srcName(t.source), t.type, t.customer, t.region, t.price, t.currency, (t.deadline || '').slice(0, 16).replace('T', ' '), t.match, (ST[t.status] || {}).l, (t.submittedAt || '').slice(0, 10), (t.wonAt || '').slice(0, 10), t.url].map(q).join(';'));
  return '﻿' + [cols.map(q).join(';'), ...rows].join('\r\n');
}
function backup() {
  const pack = list => Object.fromEntries(list.map(x => [x.id, strip(x)]));
  return JSON.stringify({ tenders: pack(S.tenders), docs: pack(S.docs), news: pack(S.news), competitors: pack(S.competitors), settings: { main: strip(S.settings) } }, null, 1);
}
async function importData(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { toast('Fayl JSON formatida emas'); return; }
  const cols = ['tenders', 'docs', 'news', 'competitors', 'settings'];
  if (!data || typeof data !== 'object' || !cols.some(c => data[c] && typeof data[c] === 'object')) { toast('Faylda Winder ma’lumotlari topilmadi'); return; }
  let n = 0;
  toast('Yuklanmoqda…');
  for (const c of cols) {
    const items = data[c]; if (!items || typeof items !== 'object') continue;
    for (const [id, body] of Object.entries(items)) {
      if (!/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id) || !body || typeof body !== 'object' || Array.isArray(body)) continue;
      if (c === 'tenders') S.selfAdded.add(id);
      const ok = await save(() => Store.set(c, id, body));
      if (!ok) { toast(`${n} ta yozuv yuklandi, qolgani saqlanmadi`); return; }
      n++;
    }
  }
  toast(`${n} ta yozuv yuklandi`);
}
async function clearSamples() {
  S.confirm = null;
  const jobs = [];
  for (const c of ['tenders', 'docs']) for (const x of S[c]) if (x.sample) jobs.push([c, x.id]);
  for (const [c, id] of jobs) { const ok = await save(() => Store.remove(c, id)); if (!ok) return; }
  S.sel = null;
  toast('Namuna ma’lumotlar o‘chirildi');
}

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && !e.altKey && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); PAL.open ? closePal() : openPal(); return; }
  if (PAL.open) {
    if (e.key === 'Escape') { e.preventDefault(); closePal(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = PAL.items.length; if (n) { PAL.i = (PAL.i + (e.key === 'ArrowDown' ? 1 : n - 1)) % n; renderPalList(); } }
    else if (e.key === 'Enter') { e.preventDefault(); runPal(PAL.i); }
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Escape') {
    if (S.modal) { if (S.modal.startsWith('edit:')) clearFormDrafts(); S.modal = null; render(); } else if (S.more) { S.more = false; renderMore(); } else if (S.sel) closeSheet();
    return;
  }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chatInput') { e.preventDefault(); sendChat(e.target.value); return; }
  const ae = document.activeElement;
  const typing = ae && (/INPUT|TEXTAREA|SELECT/.test(ae.tagName) || ae.isContentEditable);
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/' && S.view === 'tenderlar') { e.preventDefault(); const i = $('fq'); if (i) i.focus(); return; }
  if (S.modal) return;
  if (S.sel && /^[1-7]$/.test(e.key)) { e.preventDefault(); setStatus(S.sel, STATUSES[Number(e.key) - 1].k); return; }
  if (S.sel && (e.key === 'e' || e.key === 'E')) { e.preventDefault(); openEdit(S.sel); return; }
  if (S.sel && (e.key === 't' || e.key === 'T')) { e.preventDefault(); openShare(S.sel); return; }
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); S.modal = 'add'; render(); setTimeout(() => { const i = $('f-title'); if (i) i.focus(); }, 30); }
});

window.addEventListener('hashchange', () => {
  const go = () => { applyHash(); S.more = false; renderMore(); render(); window.scrollTo(0, 0); };
  if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    try { document.startViewTransition(go); return; } catch (e) { /* oddiy yo'l bilan */ }
  }
  go();
});

/* ---------- Ma'lumotlar oqimi ---------- */
function onData(col, list) {
  if (col === 'settings') {
    const main = list.find(d => d.id === 'main');
    S.settings = { ...DEFAULT_SETTINGS, ...(main ? strip(main) : {}) };
  } else if (col === 'tenders') {
    if (S.known) {
      const added = list.filter(t => !S.known.has(t.id) && !S.selfAdded.has(t.id));
      added.forEach(t => S.fresh.add(t.id));
      if (added.length === 1) toast(`Yangi tender qo‘shildi: ${added[0].title}`);
      else if (added.length > 1) toast(`${added.length} ta yangi tender qo‘shildi`);
    }
    S.known = new Set(list.map(t => t.id));
    S.tenders = list;
  } else {
    S[col] = list;
  }
  S.loaded[col] = true;
  schedule();
}
async function boot() {
  applyAppearance();
  applyHash();
  render();
  await Store.init();
  S.mode = Store.mode;
  if (S.mode === 'local') S.sample = null;
  for (const c of ['tenders', 'docs', 'news', 'competitors', 'settings']) Store.watch(c, list => onData(c, list));
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('sample').then(fn => {
      S.sample = fn || null; schedule();
      if (fn && typeof fn.limits === 'function') fn.limits().then(l => { S.imgOK = !!(l && l.images); schedule(); }).catch(() => {});
    }).catch(() => { S.sample = null; schedule(); });
    window.claude.use('downloads').then(d => { S.downloads = d || null; }).catch(() => {});
  }
  schedule();
}
boot();
})();
</script>
