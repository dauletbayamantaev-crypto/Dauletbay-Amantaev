<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delice Lux Header</title>
<link rel="stylesheet" href="local.css">
<style>
  :root{
    --bg:#430400; --bg-deep:#160100; --cream:#ffebc9; --gold:#d9ad66; --gold-hi:#f7e2ae;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;background:var(--bg-deep);overflow:hidden}
  .stage{position:relative;width:1920px;height:1080px;overflow:hidden;
    background:
      radial-gradient(900px 700px at 1390px 560px, #7a1208 0%, rgba(122,18,8,.55) 35%, rgba(67,4,0,0) 70%),
      radial-gradient(800px 640px at 470px 470px, rgba(92,10,3,.85) 0%, rgba(67,4,0,0) 70%),
      linear-gradient(180deg, #3d0400 0%, #430400 45%, #2a0200 100%);
  }
  svg.layer{position:absolute;inset:0;width:1920px;height:1080px}
  .packs{position:absolute;left:958px;top:262px;width:864px;height:auto;
    filter:drop-shadow(0 40px 50px rgba(10,0,0,.55)) saturate(1.04) contrast(1.03);}
  .txt{position:absolute;color:var(--cream);font-family:'Lexend',sans-serif}
  .overline{left:182px;top:176px;font-size:15px;font-weight:400;letter-spacing:.42em;color:var(--gold);
    display:flex;align-items:center;gap:18px;text-transform:uppercase}
  .overline i{display:block;width:56px;height:1px;background:linear-gradient(90deg,rgba(217,173,102,0),var(--gold))}
  .headline{left:182px;top:790px;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
    font-size:58px;line-height:1;letter-spacing:.01em;
    background:linear-gradient(100deg,#c9974f 0%,#f8e4b3 28%,#d6a85e 52%,#fff0cc 70%,#b9843d 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{left:186px;top:872px;font-size:16px;font-weight:300;letter-spacing:.34em;text-transform:uppercase;
    color:rgba(255,235,201,.82);display:flex;align-items:center;gap:22px}
  .sub b{font-weight:300}
  .sub .dot{width:5px;height:5px;background:var(--gold);transform:rotate(45deg)}
  .tag{position:absolute;font-family:'Lexend',sans-serif;color:var(--cream);font-size:13px;font-weight:400;
    letter-spacing:.32em;text-transform:uppercase;white-space:nowrap}
  .tag em{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:30px;
    letter-spacing:.01em;text-transform:none;color:var(--gold-hi);margin-top:6px}
  .grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.22;pointer-events:none}
</style>
</head>

<script>
// deterministic PRNG so every render is identical
let s = 20261010; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };

// --- engraved wheat ear: stem + paired grains with hatching + awns ---
function wheat(parent, x, y, len, angle, scale) {
  const g = el('g', { transform: `translate(${x} ${y}) rotate(${angle}) scale(${scale})` }, parent);
  el('path', { d: `M0 0 Q ${len*0.06} ${-len*0.5} 0 ${-len}`, 'stroke-width': 2.2 }, g);
  const head = len * 0.46, n = 9;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1), yy = -len + head * (1 - t) - 10, w = 15 - 5 * Math.abs(t - .5) * 2;
    for (const side of [-1, 1]) {
      const gg = el('g', { transform: `translate(0 ${yy}) rotate(${side * 28})` }, g);
      el('path', { d: `M0 0 C ${side*w} -6, ${side*w} -30, 0 -40 C ${-side*3} -28, ${-side*2} -8, 0 0 Z`, 'stroke-width': 1.6 }, gg);
      for (let h = 1; h <= 3; h++) el('path', { d: `M${side*h*3} ${-6-h*2} Q ${side*(h*3+2)} -20 ${side*h*2.4} ${-32+h*2}`, 'stroke-width': .9 }, gg);
      el('path', { d: `M0 -40 L ${side*10} ${-40 - 60 - rnd()*30}`, 'stroke-width': .9 }, gg);
    }
  }
  el('path', { d: `M0 ${-len} l0 -46`, 'stroke-width': 1.4 }, g);
  for (let i = 0; i < 6; i++) el('path', { d: `M0 ${-len*0.62 + i*26} q ${-14} 10 -26 30`, 'stroke-width': .8, opacity: .0 }, g);
}
const W = document.getElementById('wheat');
wheat(W, 1180, 900, 560, -24, .95);
wheat(W, 1230, 930, 520, -11, .85);
wheat(W, 1610, 900, 560, 26, .95);
wheat(W, 1560, 930, 520, 13, .85);

// --- golden dust specks ---
const D = document.getElementById('dust');
for (let i = 0; i < 70; i++) {
  const a = rnd() * Math.PI * 2, r = 330 + rnd() * 300;
  el('circle', { cx: 1390 + Math.cos(a) * r * 1.05, cy: 590 + Math.sin(a) * r * .82, r: (.6 + rnd() * 1.8).toFixed(2), opacity: (.15 + rnd() * .5).toFixed(2) }, D);
}

// --- floating puffed grains & chocolate-coated balls ---
const P = document.getElementById('puffs');
const balls = [
  // x, y, r, type, blur
  [1800, 300, 30, 'choc', 0], [1752, 352, 18, 'puff', 0], [1842, 392, 12, 'white', 0],
  [952, 600, 26, 'puff', 0], [918, 656, 14, 'choc', 0],
  [1250, 1000, 44, 'choc', 'dof4'], [1318, 1034, 28, 'puff', 'dof4'],
  [1118, 214, 14, 'white', 'dof4'], [1560, 196, 20, 'puff', 0], [1606, 230, 11, 'choc', 0],
  [1870, 1030, 70, 'choc', 'dof9'], [870, 1050, 54, 'puff', 'dof9'],
];
for (const [x, y, r, type, blur] of balls) {
  const g = el('g', blur ? { filter: `url(#${blur})` } : {}, P);
  el('ellipse', { cx: x + r*.25, cy: y + r*.9, rx: r*.9, ry: r*.35, fill: '#0b0000', opacity: .35, filter: 'url(#ballShadow)' }, g);
  if (type === 'puff') el('circle', { cx: x, cy: y, r, fill: 'url(#puffG)', filter: 'url(#lumpy)' }, g);
  else el('circle', { cx: x, cy: y, r, fill: `url(#${type === 'choc' ? 'chocG' : 'whiteG'})`, filter: 'url(#glossy)' }, g);
  if (type !== 'puff') el('ellipse', { cx: x - r*.34, cy: y - r*.4, rx: r*.26, ry: r*.15, fill: '#fff', opacity: type === 'choc' ? .45 : .7, transform: `rotate(-30 ${x - r*.34} ${y - r*.4})` }, g);
}
